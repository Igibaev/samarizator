name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg libegl1; fi
      - run: uv sync --frozen --python 3.12 --extra diarization --extra dev
      - run: uv run --frozen --extra diarization --extra dev ruff check src tests
      - run: uv run --frozen --extra diarization --extra dev pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install Whisper (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install whisper-cpp
      - name: Download local models (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: uv run --frozen --extra diarization python -m samarizator.setup_models --quality
      - name: Real local audio smoke test (Mac)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          say -v Samantha -r 100 -o /tmp/samarizator-smoke.aiff 'The project deadline is Friday. Alice will prepare the report. We need to review the budget before the next meeting. The project deadline is Friday. Alice will prepare the report. The team will meet on Monday to discuss the results. We agreed to postpone the release until the tests pass. Bob is responsible for checking the requirements. We have two open questions about the budget and the timeline. Please keep the original recording for review. The next meeting is scheduled for Wednesday.'
          uv run --frozen --extra diarization python scripts/smoke_audio.py /tmp/samarizator-smoke.aiff
