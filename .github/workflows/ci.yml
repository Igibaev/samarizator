name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg libegl1; fi
      - run: uv sync --frozen --python 3.12 --extra diarization --extra dev
      - run: uv run --frozen --extra diarization --extra dev ruff check src tests
      - run: uv run --frozen --extra diarization --extra dev pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Real local audio smoke test (Mac)
        if: runner.os == 'macOS'
        run: |
          brew install whisper-cpp
          uv run --frozen --extra diarization python -m samarizator.setup_models
          say -v Samantha -o /tmp/samarizator-smoke.aiff 'The project deadline is Friday. Alice will prepare the report. We need to review the budget before the next meeting. The project deadline is Friday. Alice will prepare the report.'
          uv run --frozen --extra diarization python scripts/smoke_audio.py /tmp/samarizator-smoke.aiff
