# Builds the portable Samarizator.app / .dmg on a GitHub macOS runner.
# Run manually (Actions → Build macOS app → Run workflow), push a tag v*, or push to main or
# a claude/** branch a commit whose message contains [build-macos] (other pushes skip the
# job, so they cost no runner time). [release-macos] in the message builds the same way and
# also publishes a GitHub release: the tag v<version from pyproject.toml> is created on that
# commit by the release step. The download page (site/, pages.yml) always offers the latest.
# Without signing secrets the app is ad-hoc signed: it works, but on first launch macOS
# asks to confirm it in Privacy & Security. With a Developer ID certificate and an
# app-specific password the build is signed and notarized and opens like any app.
name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      bundle_llm:
        description: "Embed a summary model (qwen3-4b, gemma3-12b) so the app needs no download — makes the DMG large"
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'push'
      || startsWith(github.ref, 'refs/tags/')
      || contains(github.event.head_commit.message, '[build-macos]')
      || contains(github.event.head_commit.message, '[release-macos]')
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 120
    env:
      # Secrets cannot be tested in `if:` directly.
      HAS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --frozen --extra dev --python 3.12
          uv run --frozen --extra dev pytest -q
          uv run --frozen --extra dev ruff check src tests

      - name: Cache third-party builds
        uses: actions/cache@v4
        with:
          path: |
            build/macos/src
            build/macos/out-arm64
          key: deps-arm64-${{ hashFiles('packaging/macos/build.sh', 'native/macos-capture/main.swift', 'models/bundle.json') }}

      - name: Import signing certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm cert.p12

      - name: Build app and DMG
        env:
          SAMARIZATOR_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SAMARIZATOR_BUNDLE_LLM: ${{ github.event.inputs.bundle_llm }}
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          ./packaging/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Samarizator-macOS-arm64
          path: dist/*.dmg
          compression-level: 0

      - name: Release version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release-macos]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Samarizator ${{ steps.version.outputs.tag }}
          body_path: packaging/macos/RELEASE_NOTES.md
          files: dist/*.dmg
