[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "samarizator"
version = "0.1.0"
description = "Local meeting notes for macOS: Whisper, local LLM summaries, Obsidian"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6-Essentials>=6.8,<6.11",
    "httpx>=0.28,<0.29",
    "psutil>=7,<8",
    "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
samarizator = "samarizator.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["real_final: run the real final-text stage instead of the stub"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
